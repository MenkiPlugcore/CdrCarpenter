config-version: 2

gui:
  title: "Carpenter Sawmill"
  rows: 3
  input-slot: 11
  action-slot: 13
  output-slot: 15

processing:
  # One processing batch takes 50 ticks (2.5 seconds).
  # Shift-click still processes the whole input stack as one batch.
  duration-ticks: 50
  pulse-interval-ticks: 10
  output-item: "processed_wood"
  output-per-log: 4
  accepted-inputs:
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - PALE_OAK_LOG
    - STRIPPED_OAK_LOG
    - STRIPPED_SPRUCE_LOG
    - STRIPPED_BIRCH_LOG
    - STRIPPED_JUNGLE_LOG
    - STRIPPED_ACACIA_LOG
    - STRIPPED_DARK_OAK_LOG
    - STRIPPED_MANGROVE_LOG
    - STRIPPED_CHERRY_LOG
    - STRIPPED_PALE_OAK_LOG
